name: Verify local editor
on:
  push:
    branches: [main, feat/swarag-local-studio]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install local runtime
        shell: pwsh
        run: ./Setup.ps1 -PythonPath (Get-Command python).Source
      - name: Test synthetic fixtures only
        shell: pwsh
        run: ./.venv/Scripts/python.exe -m pytest -q
